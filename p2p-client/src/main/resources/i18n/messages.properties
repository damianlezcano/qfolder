help.text=qfolder<br><br>Developed by Damian Lezcano.<br>GitHub: https://github.com/damianlezcano/qfolder<br><br>qfolder allows creating or joining a workspace to share files, chat, notes and whiteboard among users.<br><br>Basic usage:<br>- Create a workspace or join with a shared invitation.<br>- Drop files on Files or attach them in Chat to share them.<br>- Shared and downloaded files are saved in the workspace files folder.<br>- Use Notes and Whiteboard to work on shared information.<br>- When closing or disconnecting, the session is saved under the qfolder root.<br><br>File locations:<br>- qfolder root: {0}<br>- Workspace files: {1}<br>- Shared/downloaded files: {2}
