help.text=qfolder<br><br>Desarrollado por Damian Lezcano.<br>GitHub: https://github.com/damianlezcano/qfolder<br><br>qfolder permite crear o unirse a un espacio de trabajo para compartir archivos, chat, notas y pizarra entre usuarios.<br><br>Uso b\u00e1sico:<br>- Cree un espacio de trabajo o ingrese con una invitaci\u00f3n compartida.<br>- Arrastre archivos a Archivos o adj\u00fatelos en Chat para compartirlos.<br>- Los archivos compartidos y descargados se guardan en la carpeta files del workspace.<br>- Use Notas y Pizarra para trabajar informaci\u00f3n compartida.<br>- Al cerrar o desconectarse, la sesi\u00f3n se guarda bajo la ra\u00edz local de qfolder.<br><br>Ubicaci\u00f3n de archivos:<br>- Ra\u00edz local de qfolder: {0}<br>- Archivos del workspace: {1}<br>- Archivos compartidos/descargados: {2}
